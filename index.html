<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我们的第一个中秋 🌕</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #05050f;
        color: #fff;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ===== 背景层：银河 ===== */
      .sky {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, transparent 60%),
          radial-gradient(ellipse at 80% 80%, #2a1a3e 0%, transparent 50%),
          radial-gradient(ellipse at 20% 60%, #0f1a2e 0%, transparent 50%),
          #05050f;
        z-index: 0;
      }

      /* ===== 月亮 ===== */
      .moon-wrap {
        position: fixed;
        bottom: 8vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        cursor: pointer;
        animation: floatMoon 6s ease-in-out infinite;
      }
      @keyframes floatMoon {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-15px);
        }
      }
      .moon {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 30%,
          #fffdf5 0%,
          #fff4c2 25%,
          #f5e6a3 55%,
          #e8d48b 80%,
          #d4bc6a 100%
        );
        box-shadow:
          0 0 60px 20px rgba(255, 240, 180, 0.5),
          0 0 120px 50px rgba(255, 220, 120, 0.25),
          0 0 200px 100px rgba(255, 200, 100, 0.1),
          inset -20px -20px 50px rgba(200, 160, 60, 0.4);
        position: relative;
        animation: moonGlow 4s ease-in-out infinite;
      }
      @keyframes moonGlow {
        0%,
        100% {
          box-shadow:
            0 0 60px 20px rgba(255, 240, 180, 0.5),
            0 0 120px 50px rgba(255, 220, 120, 0.25),
            0 0 200px 100px rgba(255, 200, 100, 0.1),
            inset -20px -20px 50px rgba(200, 160, 60, 0.4);
        }
        50% {
          box-shadow:
            0 0 80px 30px rgba(255, 240, 180, 0.7),
            0 0 160px 70px rgba(255, 220, 120, 0.35),
            0 0 260px 130px rgba(255, 200, 100, 0.15),
            inset -20px -20px 50px rgba(200, 160, 60, 0.4);
        }
      }
      /* 陨石坑 */
      .moon::before,
      .moon::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(200, 170, 90, 0.3);
        box-shadow: inset 2px 2px 6px rgba(150, 120, 50, 0.5);
      }
      .moon::before {
        width: 28px;
        height: 28px;
        top: 30%;
        left: 25%;
      }
      .moon::after {
        width: 18px;
        height: 18px;
        top: 55%;
        left: 60%;
      }

      /* 月亮光环 */
      .moon-halo {
        position: absolute;
        inset: -40px;
        border-radius: 50%;
        border: 2px solid rgba(255, 230, 150, 0.15);
        animation: haloPulse 3s ease-in-out infinite;
      }
      @keyframes haloPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.6;
        }
      }

      /* ===== 星星 ===== */
      .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        animation: twinkle 2s infinite alternate;
      }
      @keyframes twinkle {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 1;
        }
      }

      /* 流星 */
      .shooting-star {
        position: fixed;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
        z-index: 1;
        animation: shoot 1.5s linear forwards;
      }
      .shooting-star::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 120px;
        height: 1px;
        background: linear-gradient(
          to left,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        transform: translateX(100%);
      }
      @keyframes shoot {
        0% {
          transform: translate(0, 0) rotate(-45deg);
          opacity: 1;
        }
        100% {
          transform: translate(400px, 400px) rotate(-45deg);
          opacity: 0;
        }
      }

      /* ===== 内容 ===== */
      .content {
        position: relative;
        z-index: 2;
        padding: 60px 20px 240px;
        max-width: 900px;
        margin: 0 auto;
      }

      /* 标题 */
      .hero-title {
        text-align: center;
        margin-bottom: 20px;
      }
      .hero-sub {
        font-size: 0.85rem;
        letter-spacing: 8px;
        color: rgba(255, 230, 150, 0.6);
        margin-bottom: 16px;
        text-transform: uppercase;
      }
      .hero-main {
        font-size: 1.8rem;
        color: #ffeaa7;
        text-shadow:
          0 0 30px rgba(255, 230, 150, 0.6),
          0 0 60px rgba(255, 200, 100, 0.3);
        letter-spacing: 3px;
        line-height: 1.6;
      }
      .hero-main .highlight {
        background: linear-gradient(135deg, #fff4c2, #ffd966, #f5c842);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: bold;
        font-size: 2.2rem;
      }

      /* 打字机 */
      .typewriter {
        text-align: center;
        font-size: 1rem;
        letter-spacing: 2px;
        line-height: 2;
        min-height: 4rem;
        margin: 24px 0 40px;
        color: #ffeaa7;
        text-shadow: 0 0 20px rgba(255, 230, 150, 0.5);
      }
      .typewriter::after {
        content: "|";
        animation: blink 0.8s infinite;
        color: #ffeaa7;
      }
      .typewriter.done::after {
        display: none;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* 分隔线 */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 40px 0;
        color: rgba(255, 230, 150, 0.4);
        font-size: 0.8rem;
        letter-spacing: 4px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 230, 150, 0.3),
          transparent
        );
      }

      /* ===== 网格 ===== */
      .gallery {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
      }
      .photo-card {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 230, 150, 0.15);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        transition:
          transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.5s ease,
          border-color 0.5s ease;
        cursor: pointer;
        aspect-ratio: 1 / 1;
      }
      .photo-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent 40%,
          rgba(255, 230, 150, 0.08) 100%
        );
        opacity: 0;
        transition: opacity 0.5s;
      }
      .photo-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow:
          0 16px 50px rgba(255, 220, 120, 0.35),
          0 0 0 1px rgba(255, 230, 150, 0.4);
        border-color: rgba(255, 230, 150, 0.6);
      }
      .photo-card:hover::after {
        opacity: 1;
      }
      .photo-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition:
          transform 0.7s ease,
          filter 0.5s;
        filter: brightness(0.9) saturate(1.1);
      }
      .photo-card:hover img {
        transform: scale(1.1);
        filter: brightness(1.1) saturate(1.2);
      }

      .photo-card.span-6 {
        grid-column: span 6;
        aspect-ratio: 16 / 9;
      }
      .photo-card.span-3 {
        grid-column: span 3;
        aspect-ratio: 4 / 3;
      }
      .photo-card.span-2 {
        grid-column: span 2;
        aspect-ratio: 1 / 1;
      }

      .photo-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 4px 12px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 230, 150, 0.4);
        border-radius: 50px;
        font-size: 0.7rem;
        color: #ffeaa7;
        letter-spacing: 1px;
        z-index: 3;
        opacity: 0;
        transform: translateY(-8px);
        transition: all 0.4s;
      }
      .photo-card:hover .photo-badge {
        opacity: 1;
        transform: translateY(0);
      }

      .photo-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 40px 16px 14px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
        color: #ffeaa7;
        font-size: 0.85rem;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.4s;
        pointer-events: none;
        z-index: 2;
      }
      .photo-card:hover .photo-caption {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 640px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .photo-card.span-6 {
          grid-column: span 2;
          aspect-ratio: 4 / 3;
        }
        .photo-card.span-3 {
          grid-column: span 2;
          aspect-ratio: 4 / 3;
        }
        .photo-card.span-2 {
          grid-column: span 1;
          aspect-ratio: 1 / 1;
        }
        .hero-main {
          font-size: 1.3rem;
        }
        .hero-main .highlight {
          font-size: 1.6rem;
        }
        .hero-sub {
          font-size: 0.7rem;
          letter-spacing: 4px;
        }
      }

      /* ===== 情书全屏页 ===== */
      .love-page {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at 50% 20%,
          #1e1e3a 0%,
          #0a0a18 60%,
          #05050f 100%
        );
        z-index: 1000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        opacity: 0;
        transition: opacity 0.6s ease;
        overflow-y: auto;
      }
      .love-page.active {
        display: flex;
        opacity: 1;
      }

      /* 情书页背景星星 */
      .love-page::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(
            2px 2px at 20% 30%,
            rgba(255, 255, 255, 0.5),
            transparent
          ),
          radial-gradient(
            2px 2px at 60% 70%,
            rgba(255, 255, 255, 0.4),
            transparent
          ),
          radial-gradient(
            1px 1px at 80% 20%,
            rgba(255, 255, 255, 0.6),
            transparent
          ),
          radial-gradient(
            1px 1px at 40% 80%,
            rgba(255, 255, 255, 0.3),
            transparent
          ),
          radial-gradient(
            2px 2px at 90% 50%,
            rgba(255, 255, 255, 0.4),
            transparent
          ),
          radial-gradient(
            1px 1px at 10% 60%,
            rgba(255, 255, 255, 0.5),
            transparent
          );
        animation: twinkle 3s infinite alternate;
        pointer-events: none;
      }

      .close-btn {
        position: fixed;
        top: 20px;
        right: 24px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 230, 150, 0.3);
        color: #ffeaa7;
        font-size: 1.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1001;
        transition: all 0.3s;
        backdrop-filter: blur(8px);
      }
      .close-btn:hover {
        background: rgba(255, 230, 150, 0.2);
        transform: rotate(90deg);
        box-shadow: 0 0 30px rgba(255, 220, 120, 0.5);
      }

      /* 情书图片带光环 */
      .love-photo-wrap {
        position: relative;
        width: 100%;
        max-width: 360px;
        aspect-ratio: 1 / 1;
        margin-bottom: 28px;
      }
      .love-photo-wrap::before {
        content: "";
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 230, 150, 0.2) 0%,
          transparent 70%
        );
        animation: haloPulse 3s ease-in-out infinite;
      }
      .love-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 24px;
        box-shadow:
          0 0 60px rgba(255, 220, 120, 0.35),
          0 20px 60px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 230, 150, 0.3);
        animation: photoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        z-index: 1;
      }
      @keyframes photoIn {
        from {
          opacity: 0;
          transform: scale(0.85) rotate(-3deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      .love-badge {
        display: inline-block;
        padding: 6px 18px;
        background: linear-gradient(
          135deg,
          rgba(255, 230, 150, 0.15),
          rgba(255, 200, 100, 0.1)
        );
        border: 1px solid rgba(255, 230, 150, 0.4);
        border-radius: 50px;
        font-size: 0.75rem;
        color: #ffeaa7;
        letter-spacing: 3px;
        margin-bottom: 20px;
        text-transform: uppercase;
        box-shadow: 0 0 24px rgba(255, 220, 120, 0.2);
      }

      .love-number {
        font-size: 0.8rem;
        letter-spacing: 6px;
        color: rgba(255, 230, 150, 0.5);
        margin-bottom: 16px;
      }

      .love-text {
        max-width: 440px;
        text-align: center;
        font-size: 1.1rem;
        line-height: 2.2;
        color: #ffeaa7;
        letter-spacing: 1.5px;
        text-shadow: 0 0 24px rgba(255, 230, 150, 0.4);
        min-height: 5rem;
        padding: 0 20px;
      }
      .love-text::after {
        content: "|";
        animation: blink 0.8s infinite;
        color: #ffeaa7;
        margin-left: 2px;
      }
      .love-text.done::after {
        display: none;
      }

      /* 翻页 */
      .nav-btns {
        display: flex;
        gap: 16px;
        margin-top: 40px;
        position: relative;
        z-index: 2;
      }
      .nav-btn {
        padding: 12px 26px;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 230, 150, 0.3);
        color: #ffeaa7;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s;
        letter-spacing: 1px;
        backdrop-filter: blur(8px);
      }
      .nav-btn:hover:not(:disabled) {
        background: rgba(255, 230, 150, 0.15);
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(255, 220, 120, 0.3);
        border-color: rgba(255, 230, 150, 0.6);
      }
      .nav-btn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }

      /* ===== 音乐按钮 ===== */
      .music-btn {
        position: fixed;
        top: 20px;
        left: 24px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 230, 150, 0.3);
        color: #ffeaa7;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 100;
        transition: all 0.3s;
        backdrop-filter: blur(8px);
        font-size: 1.1rem;
      }
      .music-btn:hover {
        background: rgba(255, 230, 150, 0.2);
        box-shadow: 0 0 24px rgba(255, 220, 120, 0.4);
      }
      .music-btn.playing {
        animation: musicPulse 1.5s ease-in-out infinite;
      }
      @keyframes musicPulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(255, 220, 120, 0.3);
        }
        50% {
          box-shadow: 0 0 32px rgba(255, 220, 120, 0.7);
        }
      }

      /* ===== 桂花雨/花瓣 ===== */
      .petal {
        position: fixed;
        top: -30px;
        animation: fall linear forwards;
        z-index: 99;
        pointer-events: none;
        filter: drop-shadow(0 0 6px rgba(255, 220, 120, 0.5));
      }
      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }

      /* ===== 结尾彩蛋 ===== */
      .ending {
        text-align: center;
        padding: 60px 20px;
        margin-top: 40px;
        position: relative;
      }
      .ending-heart {
        font-size: 3rem;
        animation: heartBeat 1.5s ease-in-out infinite;
        cursor: pointer;
        display: inline-block;
        filter: drop-shadow(0 0 20px rgba(255, 100, 150, 0.6));
      }
      @keyframes heartBeat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }
      .ending-text {
        margin-top: 20px;
        font-size: 0.95rem;
        color: rgba(255, 230, 150, 0.7);
        letter-spacing: 3px;
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <!-- 背景天空 -->
    <div class="sky" id="sky"></div>

    <!-- 音乐按钮 -->
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>
    <audio id="bgMusic" loop>
      <!-- 把下面 src 换成你的音乐链接或本地文件，如 music/song.mp3 -->
      <source src="music/song.mp3" type="audio/mpeg" />
    </audio>

    <!-- 月亮 -->
    <div class="moon-wrap" id="moonWrap">
      <div class="moon-halo"></div>
      <div class="moon"></div>
    </div>

    <!-- 内容 -->
    <div class="content">
      <!-- 标题 -->
      <div class="hero-title">
        <div class="hero-sub">2026 · 中秋</div>
        <div class="hero-main">
          我们的<span class="highlight">第一个</span>中秋
        </div>
      </div>

      <!-- 打字机 -->
      <div class="typewriter" id="typewriter"></div>

      <div class="divider">✦ 我们的回忆 ✦</div>

      <!-- 图片网格 -->
      <div class="gallery" id="gallery"></div>

      <!-- 结尾 -->
      <div class="ending">
        <div class="ending-heart" onclick="heartExplosion()">❤️</div>
        <div class="ending-text">
          点一下这颗心<br />
          有惊喜
        </div>
      </div>
    </div>

    <!-- 情书页 -->
    <div class="love-page" id="lovePage">
      <div class="close-btn" onclick="closeLovePage()">✕</div>
      <div class="love-photo-wrap">
        <img class="love-photo" id="lovePhoto" src="" alt="" />
      </div>
      <div class="love-badge" id="loveBadge">第一次</div>
      <div class="love-number" id="loveNumber"></div>
      <div class="love-text" id="loveText"></div>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" onclick="prevLove()">
          ← 上一张
        </button>
        <button class="nav-btn" id="nextBtn" onclick="nextLove()">
          下一张 →
        </button>
      </div>
    </div>

    <script>
      // ============================================
      // ★★★ 改这里：15 张图 + 情话 + "第一次"标签 ★★★
      // ============================================
      const photos = [
        {
          src: "images/1.jpg",
          badge: "第一次一起过中秋",
          text: "这是我们第一次一起过中秋，我想把它做成永远的回忆。",
        },
        {
          src: "images/2.jpg",
          badge: "第一次见你笑",
          text: "你笑起来的样子，比今晚的月亮还要亮。",
        },
        {
          src: "images/3.jpg",
          badge: "第一次一起吃月饼",
          text: "甜的是月饼，更甜的是和你一起吃的每一口。",
        },
        {
          src: "images/4.jpg",
          badge: "第一次一起赏月",
          text: "今年终于不用隔着屏幕，可以牵着你的手看月亮。",
        },
        {
          src: "images/5.jpg",
          badge: "想你的夜",
          text: "每个想你的夜晚，我都抬头看看月亮，因为我们在看同一个。",
        },
        {
          src: "images/6.jpg",
          badge: "你是我最亮的星",
          text: "你是我夜空里最亮的那颗星，怎么找都不会迷路。",
        },
        {
          src: "images/7.jpg",
          badge: "桂花香里",
          text: "桂花香里全是你，风一吹，就想你。",
        },
        {
          src: "images/8.jpg",
          badge: "一起看过的风景",
          text: "和你一起看过的风景，才是真正的圆满。",
        },
        {
          src: "images/9.jpg",
          badge: "一杯茶一轮月",
          text: "一杯茶，一轮月，一个你，就是我想要的全部。",
        },
        {
          src: "images/10.jpg",
          badge: "心跳的瞬间",
          text: "每次靠近你，心跳都会出卖我。",
        },
        {
          src: "images/11.jpg",
          badge: "圆圆满满",
          text: "月亮圆了，我们的故事也要一直圆圆满满。",
        },
        {
          src: "images/12.jpg",
          badge: "你的侧脸",
          text: "你的侧脸，是我看过最美的风景。",
        },
        {
          src: "images/13.jpg",
          badge: "中秋快乐",
          text: "中秋快乐，我最爱的人。",
        },
        {
          src: "images/14.jpg",
          badge: "走很远",
          text: "想和你一起走很远很远，走到月亮都换了好几轮。",
        },
        {
          src: "images/15.jpg",
          badge: "每一年",
          text: "明年的中秋，后年的中秋，每一年的中秋，都想和你一起过。",
        },
      ];

      // ============================================
      // 以下不用改
      // ============================================

      const layoutClasses = [
        "span-6",
        "span-3",
        "span-3",
        "span-6",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
        "span-2",
      ];

      // 生成卡片
      const gallery = document.getElementById("gallery");
      photos.forEach((photo, index) => {
        const card = document.createElement("div");
        card.className = "photo-card " + (layoutClasses[index] || "span-2");
        card.onclick = () => openLovePage(index);
        card.innerHTML = `
      <img src="${photo.src}" alt="" loading="lazy">
      <div class="photo-badge">${photo.badge}</div>
      <div class="photo-caption">${photo.text.substring(0, 20)}...</div>
    `;
        gallery.appendChild(card);
      });

      // ===== 星星 & 流星 =====
      const sky = document.getElementById("sky");
      for (let i = 0; i < 160; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 2 + "s";
        const size = Math.random() * 2 + 1;
        star.style.width = star.style.height = size + "px";
        sky.appendChild(star);
      }

      // 流星
      function createShootingStar() {
        const s = document.createElement("div");
        s.className = "shooting-star";
        s.style.left = Math.random() * 60 + "%";
        s.style.top = Math.random() * 40 + "%";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
      setInterval(createShootingStar, 3500);

      // ===== 打字机 =====
      const text = "这是我们第一次一起过中秋，我想把它做成永远的回忆。";
      const el = document.getElementById("typewriter");
      let i = 0;
      function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(type, 120);
        } else {
          el.classList.add("done");
        }
      }
      setTimeout(type, 1500);

      // ===== 情书页逻辑 =====
      let currentIndex = 0;
      let typeTimer = null;

      function openLovePage(index) {
        currentIndex = index;
        renderLovePage();
        document.getElementById("lovePage").classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeLovePage() {
        document.getElementById("lovePage").classList.remove("active");
        document.body.style.overflow = "";
        if (typeTimer) clearTimeout(typeTimer);
      }

      function renderLovePage() {
        const photo = photos[currentIndex];
        document.getElementById("lovePhoto").src = photo.src;
        document.getElementById("loveBadge").textContent = photo.badge;
        document.getElementById("loveNumber").textContent =
          `${String(currentIndex + 1).padStart(2, "0")} / ${String(photos.length).padStart(2, "0")}`;

        // 重新触发图片动画
        const photoEl = document.getElementById("lovePhoto");
        photoEl.style.animation = "none";
        photoEl.offsetHeight;
        photoEl.style.animation =
          "photoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";

        // 打字机
        const textEl = document.getElementById("loveText");
        textEl.textContent = "";
        textEl.classList.remove("done");
        if (typeTimer) clearTimeout(typeTimer);
        let j = 0;
        const fullText = photo.text;
        function typeLove() {
          if (j < fullText.length) {
            textEl.textContent += fullText.charAt(j);
            j++;
            typeTimer = setTimeout(typeLove, 80);
          } else {
            textEl.classList.add("done");
          }
        }
        typeLove();

        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").disabled =
          currentIndex === photos.length - 1;

        // 花瓣环绕
        petalBurst();
      }

      function prevLove() {
        if (currentIndex > 0) {
          currentIndex--;
          renderLovePage();
        }
      }
      function nextLove() {
        if (currentIndex < photos.length - 1) {
          currentIndex++;
          renderLovePage();
        }
      }

      // 键盘
      document.addEventListener("keydown", (e) => {
        if (!document.getElementById("lovePage").classList.contains("active"))
          return;
        if (e.key === "ArrowLeft") prevLove();
        if (e.key === "ArrowRight") nextLove();
        if (e.key === "Escape") closeLovePage();
      });

      // 手机滑动
      let touchStartX = 0;
      document
        .getElementById("lovePage")
        .addEventListener("touchstart", (e) => {
          touchStartX = e.changedTouches[0].screenX;
        });
      document.getElementById("lovePage").addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) prevLove();
          else nextLove();
        }
      });

      // ===== 花瓣 =====
      function createPetal(emoji) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.textContent = emoji;
        petal.style.left = Math.random() * 100 + "%";
        petal.style.animationDuration = Math.random() * 3 + 4 + "s";
        petal.style.fontSize = Math.random() * 16 + 14 + "px";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 7000);
      }

      function startPetalRain() {
        const emojis = ["🌸", "💛", "🌙", "⭐", "🥮", "❤️", "✨"];
        for (let i = 0; i < 80; i++) {
          setTimeout(() => {
            createPetal(emojis[Math.floor(Math.random() * emojis.length)]);
          }, i * 60);
        }
      }

      // 点击情书页时花瓣爆发
      function petalBurst() {
        const emojis = ["🌸", "💛", "✨", "🌙"];
        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            createPetal(emojis[Math.floor(Math.random() * emojis.length)]);
          }, i * 40);
        }
      }

      // 点击月亮花瓣雨
      document
        .getElementById("moonWrap")
        .addEventListener("click", startPetalRain);

      // ===== 音乐 =====
      let musicPlaying = false;
      const bgMusic = document.getElementById("bgMusic");
      const musicBtn = document.getElementById("musicBtn");

      function toggleMusic() {
        if (musicPlaying) {
          bgMusic.pause();
          musicBtn.classList.remove("playing");
          musicBtn.textContent = "🎵";
        } else {
          bgMusic
            .play()
            .then(() => {
              musicBtn.classList.add("playing");
              musicBtn.textContent = "🔊";
            })
            .catch(() => {
              alert(
                "音乐播放失败，请检查 music/song.mp3 是否存在，或换成在线链接。",
              );
            });
        }
        musicPlaying = !musicPlaying;
      }

      // ===== 结尾爱心爆炸 =====
      function heartExplosion() {
        const emojis = ["❤️", "💛", "💖", "✨", "🌙", "🌸"];
        for (let i = 0; i < 60; i++) {
          setTimeout(() => {
            const p = document.createElement("div");
            p.className = "petal";
            p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = 50 + (Math.random() - 0.5) * 60 + "%";
            p.style.animationDuration = Math.random() * 2 + 3 + "s";
            p.style.fontSize = Math.random() * 24 + 18 + "px";
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 6000);
          }, i * 40);
        }

        // 弹一句告白
        setTimeout(() => {
          const confession = document.createElement("div");
          confession.style.cssText = `
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 1.6rem; color: #ffeaa7;
        text-align: center; line-height: 2;
        text-shadow: 0 0 40px rgba(255,220,120,0.9);
        z-index: 9999; pointer-events: none;
        transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        letter-spacing: 4px;
        padding: 20px;
        background: rgba(10,10,20,0.6);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,230,150,0.3);
      `;
          confession.innerHTML = `这是我们第一个中秋<br>以后每一个都陪你过 🌕`;
          document.body.appendChild(confession);
          requestAnimationFrame(() => {
            confession.style.transform = "translate(-50%, -50%) scale(1)";
          });
          setTimeout(() => {
            confession.style.transform = "translate(-50%, -50%) scale(0)";
            setTimeout(() => confession.remove(), 800);
          }, 3500);
        }, 1000);
      }
    </script>
  </body>
</html>
