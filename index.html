<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给最爱的你 · 中秋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 120%, #1a1a2e, #0f0f1a);
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* 月亮 */
  .moon {
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 180px;
    background: radial-gradient(circle at 35% 35%, #fff8e7, #f5e6a3 40%, #e8d48b 70%);
    border-radius: 50%;
    box-shadow: 0 0 80px 30px rgba(255, 240, 180, 0.4),
                0 0 160px 60px rgba(255, 220, 120, 0.15);
    animation: rise 3s ease-out forwards;
    z-index: 1;
    cursor: pointer;
  }
  @keyframes rise { to { bottom: 12vh; } }

  /* 星星 */
  .stars {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

  /* 内容 */
  .content {
    position: relative; z-index: 2;
    padding: 60px 20px 200px;
    max-width: 900px; margin: 0 auto;
  }
  .typewriter {
    font-size: 1.3rem; letter-spacing: 2px; line-height: 2;
    min-height: 6rem; margin-bottom: 30px;
    color: #ffeaa7; text-shadow: 0 0 20px rgba(255, 230, 150, 0.5);
  }

  /* 网格 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }
  .photo-card {
    position: relative; border-radius: 16px; overflow: hidden;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,230,150,0.15);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .photo-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 14px 45px rgba(255,220,120,0.3);
    z-index: 5;
  }
  .photo-card img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; transition: transform 0.6s ease;
  }
  .photo-card:hover img { transform: scale(1.08); }

  .photo-card.span-6 { grid-column: span 6; aspect-ratio: 16 / 9; }
  .photo-card.span-3 { grid-column: span 3; aspect-ratio: 4 / 3; }
  .photo-card.span-2 { grid-column: span 2; aspect-ratio: 1 / 1; }

  .photo-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 36px 16px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    color: #ffeaa7; font-size: 0.85rem; letter-spacing: 1px;
    opacity: 0; transform: translateY(8px);
    transition: all 0.4s ease; pointer-events: none;
  }
  .photo-card:hover .photo-caption { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .photo-card.span-6 { grid-column: span 2; aspect-ratio: 4 / 3; }
    .photo-card.span-3 { grid-column: span 2; aspect-ratio: 4 / 3; }
    .photo-card.span-2 { grid-column: span 1; aspect-ratio: 1 / 1; }
    .typewriter { font-size: 1.1rem; }
  }

  /* ===== 情书全屏页 ===== */
  .love-page {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 0%, #1e1e35, #0a0a14 70%);
    z-index: 1000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    opacity: 0;
    transition: opacity 0.5s ease;
    overflow-y: auto;
  }
  .love-page.active {
    display: flex;
    opacity: 1;
  }

  /* 关闭按钮 */
  .close-btn {
    position: fixed; top: 20px; right: 24px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,230,150,0.3);
    color: #ffeaa7; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 1001;
    transition: all 0.3s;
  }
  .close-btn:hover { background: rgba(255,230,150,0.2); transform: rotate(90deg); }

  /* 情书内容 */
  .love-photo {
    width: 100%; max-width: 380px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,220,120,0.25),
                0 20px 60px rgba(0,0,0,0.6);
    margin-bottom: 28px;
    animation: photoIn 0.7s ease;
  }
  @keyframes photoIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .love-number {
    font-size: 0.8rem;
    letter-spacing: 4px;
    color: rgba(255,230,150,0.5);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .love-text {
    max-width: 420px;
    text-align: center;
    font-size: 1.05rem;
    line-height: 2.2;
    color: #ffeaa7;
    letter-spacing: 1.5px;
    text-shadow: 0 0 24px rgba(255,230,150,0.4);
    min-height: 4rem;
  }
  .love-text::after {
    content: "|";
    animation: blink 0.8s infinite;
    color: #ffeaa7;
    margin-left: 2px;
  }
  .love-text.done::after { display: none; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 翻页按钮 */
  .nav-btns {
    display: flex; gap: 20px;
    margin-top: 36px;
  }
  .nav-btn {
    padding: 12px 28px;
    border-radius: 50px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,230,150,0.3);
    color: #ffeaa7;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .nav-btn:hover {
    background: rgba(255,230,150,0.15);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,220,120,0.2);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* 桂花雨 */
  .petal {
    position: fixed; top: -20px;
    animation: fall linear forwards;
    z-index: 99; pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="moon" id="moon"></div>

<div class="content">
  <div class="typewriter" id="typewriter"></div>

  <div class="gallery" id="gallery">
    <!-- 图片由 JS 自动生成，见下方 data -->
  </div>
</div>

<!-- 情书全屏页 -->
<div class="love-page" id="lovePage">
  <div class="close-btn" onclick="closeLovePage()">✕</div>
  <img class="love-photo" id="lovePhoto" src="" alt="">
  <div class="love-number" id="loveNumber"></div>
  <div class="love-text" id="loveText"></div>
  <div class="nav-btns">
    <button class="nav-btn" id="prevBtn" onclick="prevLove()">← 上一张</button>
    <button class="nav-btn" id="nextBtn" onclick="nextLove()">下一张 →</button>
  </div>
</div>

<script>
  // ============================================
  // ★★★ 在这里改你的 15 张图和情话 ★★★
  // ============================================
  const photos = [
    { src: "images/1.jpg",  text: "第一次见你的时候，我就知道，这个中秋不再是一个人。" },
    { src: "images/2.jpg",  text: "你笑起来的样子，比今晚的月亮还要亮。" },
    { src: "images/3.jpg",  text: "记得我们一起吃的那块月饼吗？甜的是月饼，更甜的是你。" },
    { src: "images/4.jpg",  text: "去年中秋隔着屏幕，今年我想牵着你的手一起看月亮。" },
    { src: "images/5.jpg",  text: "每个想你的夜晚，我都抬头看看月亮，因为我们在看同一个。" },
    { src: "images/6.jpg",  text: "你是我夜空里最亮的那颗星，怎么找都不会迷路。" },
    { src: "images/7.jpg",  text: "桂花香里全是你，风一吹，就想你。" },
    { src: "images/8.jpg",  text: "和你一起看过的风景，才是真正的圆满。" },
    { src: "images/9.jpg",  text: "一杯茶，一轮月，一个你，就是我想要的全部。" },
    { src: "images/10.jpg", text: "每次靠近你，心跳都会出卖我。" },
    { src: "images/11.jpg", text: "月亮圆了，我们的故事也要一直圆圆满满。" },
    { src: "images/12.jpg", text: "你的侧脸，是我看过最美的风景。" },
    { src: "images/13.jpg", text: "中秋快乐，我最爱的人。" },
    { src: "images/14.jpg", text: "想和你一起走很远很远，走到月亮都换了好几轮。" },
    { src: "images/15.jpg", text: "明年的中秋，后年的中秋，每一年的中秋，都想和你一起过。" }
  ];

  // ============================================
  // 以下不用改
  // ============================================

  // 布局类名（15张：1大 + 2中 + 1大 + 11小）
  const layoutClasses = [
    "span-6", "span-3", "span-3", "span-6",
    "span-2","span-2","span-2","span-2","span-2","span-2",
    "span-2","span-2","span-2","span-2","span-2"
  ];

  // 生成图片卡片
  const gallery = document.getElementById('gallery');
  photos.forEach((photo, index) => {
    const card = document.createElement('div');
    card.className = 'photo-card ' + (layoutClasses[index] || 'span-2');
    card.onclick = () => openLovePage(index);
    card.innerHTML = `<img src="${photo.src}" alt="">`;
    gallery.appendChild(card);
  });

  // 星星
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 140; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    const size = Math.random() * 2 + 1;
    star.style.width = star.style.height = size + 'px';
    starsContainer.appendChild(star);
  }

  // 打字机（首页）
  const text = "今晚的月亮很美，但我更想见你。";
  const el = document.getElementById('typewriter');
  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, 150);
    }
  }
  setTimeout(type, 1200);

  // ===== 情书页逻辑 =====
  let currentIndex = 0;
  let typeTimer = null;

  function openLovePage(index) {
    currentIndex = index;
    renderLovePage();
    document.getElementById('lovePage').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLovePage() {
    document.getElementById('lovePage').classList.remove('active');
    document.body.style.overflow = '';
    if (typeTimer) clearTimeout(typeTimer);
  }

  function renderLovePage() {
    const photo = photos[currentIndex];
    document.getElementById('lovePhoto').src = photo.src;
    document.getElementById('loveNumber').textContent = 
      `${String(currentIndex + 1).padStart(2, '0')} / ${String(photos.length).padStart(2, '0')}`;

    // 打字机效果
    const textEl = document.getElementById('loveText');
    textEl.textContent = '';
    textEl.classList.remove('done');
    if (typeTimer) clearTimeout(typeTimer);
    let j = 0;
    const fullText = photo.text;
    function typeLove() {
      if (j < fullText.length) {
        textEl.textContent += fullText.charAt(j);
        j++;
        typeTimer = setTimeout(typeLove, 80);
      } else {
        textEl.classList.add('done');
      }
    }
    typeLove();

    // 按钮状态
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === photos.length - 1;
  }

  function prevLove() {
    if (currentIndex > 0) {
      currentIndex--;
      renderLovePage();
    }
  }
  function nextLove() {
    if (currentIndex < photos.length - 1) {
      currentIndex++;
      renderLovePage();
    }
  }

  // 键盘左右键翻页
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lovePage').classList.contains('active')) return;
    if (e.key === 'ArrowLeft') prevLove();
    if (e.key === 'ArrowRight') nextLove();
    if (e.key === 'Escape') closeLovePage();
  });

  // 手机左右滑动
  let touchStartX = 0;
  document.getElementById('lovePage').addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });
  document.getElementById('lovePage').addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) prevLove();
      else nextLove();
    }
  });

  // 桂花雨
  function startPetalRain() {
    const emojis = ['🌸', '💛', '🌙', '⭐', '🥮', '❤️'];
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        petal.style.left = Math.random() * 100 + '%';
        petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
        petal.style.fontSize = (Math.random() * 20 + 14) + 'px';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
      }, i * 70);
    }
  }
  document.getElementById('moon').addEventListener('click', startPetalRain);
</script>

</body>
</html>
